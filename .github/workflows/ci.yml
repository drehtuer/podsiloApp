# SPDX-License-Identifier: GPL-3.0-or-later
#
# Tier 1 CI: lint, static analysis, JVM unit tests, and an Android build — all
# without an emulator (see CLAUDE.md §4/§7). Instrumented tests (Tier 2) are
# deliberately not run here; §4 asks for Tier 1 + Tier 3 as the supported path.
#
# Eight checks in one job, in this order: yamllint, shellcheck, asciidoctor,
# ktlint, detekt, Android lint, the Tier 1 unit tests, then both APK builds. The
# three cheapest come first and need no JDK. One job rather than seven means the badge answers one
# question — "is main healthy" — and the step that failed is one click away.
#
# The unit-test step also measures coverage, and a SonarQube Cloud scan then
# ingests the JaCoCo XML — that is where the two coverage badges in README.adoc
# get their numbers. It is a report, not a ninth check: there is no
# `sonar.qualitygate.wait`, so a red gate or a dropped percentage never fails
# this workflow. See decisions/0028; sonar-project.properties is the config.
#
# DO NOT ADD `connectedAndroidTest` TO THIS WORKFLOW. Everything under
# `src/androidTest/` is the device test set (`./scripts/device-test.sh`,
# dev-environment.adoc §6), and it exists precisely to check the things a
# hosted runner cannot: ICU regex strictness, the device's SQLite, the installed
# manifest, the cleartext policy, a real Compose runtime. A runner has no device,
# so such a job could only be skipped, fail, or boot an emulator — and an
# emulator agreeing with Robolectric is what let three of this project's worst
# bugs through. The split by source set is the isolation; keep it.
#
# ARTIFACTS
#
# Both variants are built. `podsilo-<version>-debug.apk` is installable as-is,
# signed with the project's shared debug key (`PODSILO_DEBUG_KEYSTORE_BASE64`)
# so that it can be upgraded in place by a locally built debug APK and vice
# versa — which was impossible while AGP signed it with the runner's own
# generated keystore. See dev-environment.adoc §10.
# `podsilo-<version>.apk` is the real release: R8-minified and resource-shrunk,
# roughly a twelfth the size, and **signed only when the keystore secrets are
# configured** — see dev-environment.adoc §9. Without them it still builds,
# but unsigned, and an unsigned APK cannot be installed. That is why the release
# job below refuses to attach one rather than shipping a file that looks like a
# download and isn't.
#
# Every run uploads them as short-lived workflow artifacts. When a GitHub Release
# is **drafted** they are attached to it as well, where they persist indefinitely —
# release assets aren't subject to the artifact retention window.
#
# CUTTING A RELEASE: merge the version bump, then **push the tag**. This workflow
# builds it, creates a DRAFT release if one does not exist, and attaches the APKs
# to the draft. You then write the notes and publish. Publishing first cannot be
# undone — immutable releases refuse assets after publication, and GitHub keeps
# the tag name reserved even if the release is deleted, so the version number is
# spent. dev-environment.adoc §10 has the procedure.
name: CI

on:
  push:
    branches: [main]
    # A pushed tag is what drives a release, NOT the `release:` event. Two
    # separate facts force this, both learned the expensive way on v0.5.0:
    #
    #   1. This repository has immutable releases enabled, so a *published*
    #      release refuses every asset upload — `HTTP 422: Cannot upload assets
    #      to an immutable release`. Assets have to arrive while it is a draft.
    #   2. GitHub does not fire the `release` event for draft releases **at
    #      all** — not `created`, not `edited`. So no `release:` trigger can
    #      ever attach assets to a draft. Verified: creating the v0.5.1 draft
    #      produced no workflow run whatsoever.
    #
    # A tag push fires reliably and needs no release to exist yet, so the job
    # below creates the draft itself if the author has not already written one.
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Only release-triggered runs actually write anything (attaching the APK to
    # the release); push/pull_request runs never exercise that permission.
    permissions:
      contents: write
      # SonarQube decorates the pull request with its findings.
      pull-requests: write
    # At job level so the `if:` on the scan step can see it — a step's own `env:`
    # is not in scope for that step's own condition.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode is `git rev-list --count HEAD` (app/build.gradle.kts). The
          # default shallow clone would make every build number 1. SonarQube
          # needs the same full history for a second reason: it attributes issues
          # to a commit and an author, and works out what "new code" means from
          # the dates — against a shallow clone every line reads as new.
          fetch-depth: 0

      # Repository hygiene for the two languages Gradle cannot see: YAML (this
      # workflow, dependabot.yml, the compose file, detekt's config) and bash (the
      # scripts under .devcontainer/ and scripts/, which have no tests at all).
      # Both run before the JDK is set up — neither needs it, and a config typo
      # should fail in seconds rather than after a full test run.
      #
      # Rules live in .yamllint.yml and .shellcheckrc at the repository root, so
      # these commands behave identically in the dev container, which carries both
      # tools. Installed from Ubuntu's archive rather than trusting the runner
      # image's preinstalled set, which also keeps the version close to noble's —
      # a linter that disagrees with the container is worse than no linter.
      - name: Install YAML, shell and AsciiDoc linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yamllint shellcheck asciidoctor

      - name: yamllint
        run: yamllint .

      # `git ls-files` rather than a fixed glob, so a script added anywhere is
      # covered without editing this file. -z/-0 because a filename may contain
      # whitespace; -r so an empty list is not an invocation with no arguments.
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      # The documentation is AsciiDoc, and Asciidoctor is the only thing that can say
      # whether it still parses. --failure-level=WARN is what makes it a check rather
      # than a render: a heading out of sequence or an unclosed block is a warning, and
      # a warning that does not fail is a warning nobody reads.
      - name: asciidoctor
        run: git ls-files -z '*.adoc' | xargs -0 -r asciidoctor --failure-level=WARN -o /dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ktlint
        run: ./gradlew ktlintCheck

      # The other half of the pair CLAUDE.md §12 names, and it was missing: the
      # header above has always listed detekt among the eight checks, and no step
      # ran it. So the definition of done asked for something the badge did not
      # answer, and a project-wide detekt regression could reach `main` green.
      #
      # It costs almost nothing, which is what makes the omission worth fixing
      # rather than documenting away. detekt reads the sources without type
      # resolution, so it resolves no dependency and compiles nothing: a full
      # `--rerun-tasks` over all twelve modules is six seconds locally, against
      # ten minutes for the test step below.
      #
      # Placed beside ktlint deliberately - both read Kotlin rather than the
      # platform, both fail on findings rather than warnings, and neither needs
      # anything the other does not.
      - name: detekt
        run: ./gradlew detekt

      # Android lint, which is a different question from ktlint and detekt: those
      # read Kotlin as text and as a syntax tree, this one knows the platform —
      # API levels, manifest merging, resource shrinking, SAF, WorkManager. It is
      # the check that would have caught the missing `foregroundServiceType` had
      # the declaration not been in a module lint could not see (core/download's
      # build.gradle.kts explains the one suppression this repository has).
      #
      # Adopted only once it was green everywhere. `lint` fails the build on
      # errors, not warnings, so `GradleDependency` telling us a newer Compose BOM
      # exists stays Dependabot's business rather than becoming a red badge.
      - name: Android lint
        run: ./gradlew lint

      # `coverage`, not `test`. The root task (build.gradle.kts) runs exactly the
      # same Tier 1 suite and additionally writes one JaCoCo XML report per module;
      # running `test` as well here would just run all of it twice.
      - name: Unit tests (Tier 1) with coverage
        run: ./gradlew coverage

      # Runs after `coverage` so the JaCoCo XML and the JUnit results already
      # exist; sonar-project.properties names the paths rather than passing them
      # here, so the same scan can be reproduced locally.
      #
      # Skipped when the token is absent, which is what a pull request from a
      # fork looks like — a missing secret should not read as a failed build.
      # SONAR_TOKEN is set at job level because a step's own `env:` block is not
      # in scope for that step's own `if:` (the same trap the keystore step
      # below documents).
      #
      # Deliberately NO `-Dsonar.qualitygate.wait=true`. Coverage here is
      # measured and not enforced (decisions/0028): CLAUDE.md §7 ranks what
      # matters — reconciliation first, Compose smoke tests last — and one
      # repository-wide percentage cannot express that ranking, so a gate on it
      # would fail pull requests for reasons nobody intends to act on.
      #
      # Unlike the Codecov step this replaced, there is no "fail if the upload
      # found nothing" guard, because there is nothing to guard: the scanner
      # fails by itself when `sonar.coverage.jacoco.xmlReportPaths` matches no
      # file, rather than accepting an upload of nothing and leaving the badge
      # showing last week's number.
      - name: SonarQube scan
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.projectVersion=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

      # The debug key, decoded the same way as the release key below and for the
      # same reason — but note the two fail differently, and neither fails the
      # build. Without this, AGP falls back to the runner's own generated
      # `~/.android/debug.keystore`, which still produces an installable APK;
      # it just cannot be upgraded in place by a debug build from anywhere else.
      # A missing release key produces an *unsigned* APK, which cannot be
      # installed at all. So this step warns and continues, exactly as that one
      # does.
      #
      # The debug key is not a secret in the way the release key is — it is the
      # Android convention (alias `androiddebugkey`, password `android`) and
      # signs nothing anyone installs from a release. It is carried as a secret
      # for symmetry with the release key, not because the value is sensitive;
      # dev-environment.adoc §10 says so where someone reading `keystore/` will
      # find it.
      - name: Decode debug keystore
        id: debug-keystore
        env:
          KEYSTORE: ${{ secrets.PODSILO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          jks="$RUNNER_TEMP/podsilo-debug.jks"
          if [ -z "$KEYSTORE" ]; then
              echo "No debug keystore secret configured — AGP's generated debug key will be used."
              exit 0
          fi

          if ! printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 -d > "$jks" 2>/dev/null || [ ! -s "$jks" ]; then
              rm -f "$jks"
              echo "::warning::PODSILO_DEBUG_KEYSTORE_BASE64 could not be decoded — falling back to AGP's generated debug key. Regenerate with: base64 -w0 keystore/podsilo-debug.jks"
              exit 0
          fi

          echo "Decoded debug keystore: $(wc -c < "$jks") bytes"
          echo "path=$jks" >> "$GITHUB_OUTPUT"

      # The keystore never exists in the repository. It is written from a secret
      # into the runner's workspace for the length of the job, and the workspace
      # is discarded with the runner. `PODSILO_KEYSTORE_BASE64` is the .jks
      # base64-encoded; the other three are its passwords and alias.
      # Emptiness is handled inside the script rather than by a step-level `if`:
      # a step's own `env:` block is not in scope for its `if`, which is a quiet
      # way to end up with a condition that is always false.
      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE: ${{ secrets.PODSILO_KEYSTORE_BASE64 }}
        run: |
          jks="$RUNNER_TEMP/podsilo-release.jks"
          if [ -z "$KEYSTORE" ]; then
              echo "No keystore secret configured — the release APK will be unsigned."
              exit 0
          fi

          # Whitespace is stripped BEFORE decoding. A value pasted from a wrapped
          # terminal, or stored with CRLF because it was produced on Windows, is
          # perfectly good base64 content that `base64 -d` nonetheless refuses
          # with "invalid input" — which reads as "your key is broken" when the
          # truth is "your paste had newlines in it".
          if ! printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 -d > "$jks" 2>/dev/null || [ ! -s "$jks" ]; then
              rm -f "$jks"
              echo "::warning::PODSILO_KEYSTORE_BASE64 could not be decoded — the release APK will be unsigned. Regenerate the secret with: base64 -w0 podsilo-release.jks"
              exit 0
          fi

          # A size, not the contents. Enough to tell "decoded to something
          # keystore-shaped" from "decoded to nothing useful" without printing
          # any part of a signing key into a public log.
          echo "Decoded keystore: $(wc -c < "$jks") bytes"
          echo "path=$jks" >> "$GITHUB_OUTPUT"

      - name: Assemble debug and release APKs
        env:
          PODSILO_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          PODSILO_KEYSTORE_PASSWORD: ${{ secrets.PODSILO_KEYSTORE_PASSWORD }}
          PODSILO_KEY_ALIAS: ${{ secrets.PODSILO_KEY_ALIAS }}
          PODSILO_KEY_PASSWORD: ${{ secrets.PODSILO_KEY_PASSWORD }}
          PODSILO_DEBUG_KEYSTORE_FILE: ${{ steps.debug-keystore.outputs.path }}
          PODSILO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.PODSILO_DEBUG_KEYSTORE_PASSWORD }}
          PODSILO_DEBUG_KEY_ALIAS: ${{ secrets.PODSILO_DEBUG_KEY_ALIAS }}
          PODSILO_DEBUG_KEY_PASSWORD: ${{ secrets.PODSILO_DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      # The R8 mapping goes with them. A stack trace from a minified build is
      # unreadable without the mapping that produced it, and it is regenerated
      # by every build — so if it is not kept alongside the APK it is shipped
      # with, it is gone.
      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: podsilo-apks
          path: |
            app/build/outputs/apk/debug/podsilo-*.apk
            app/build/outputs/apk/release/podsilo-*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 7

      # An unsigned release APK is not attached: it downloads like a real build
      # and then refuses to install, which is worse than its absence. The debug
      # APK always goes up, so a release is never left with nothing installable.
      - name: Attach APKs to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # If the author has not written the release yet, create it as a draft so
          # the tag alone is enough to cut one. `--notes` is a placeholder they are
          # expected to replace before publishing; `--verify-tag` is pointless here
          # because the tag is what triggered this run.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --draft --title "$TAG" \
                  --notes "Draft created by CI. Replace these notes, then publish."
          fi

          # Immutable releases accept assets only before publication, so a release
          # that is already published cannot be fixed by this job — and its tag name
          # is burned for good, because GitHub reserves the tag of an immutable
          # release even after the release is deleted. Fail loudly rather than warn:
          # a silent skip is what left v0.5.0 with no APKs while every check passed.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published — immutable releases refuse assets, and the tag is now spent. Draft first, then publish: dev-environment.adoc §10."
              exit 1
          fi

          gh release upload "$TAG" app/build/outputs/apk/debug/podsilo-*-debug.apk --clobber

          # `apksigner verify`, NOT a grep for META-INF/*.RSA. That file is produced by v1 (JAR)
          # signing, which is off here — a correctly v2/v3-signed APK contains no such entry, so the
          # obvious check rejects exactly the APKs it is meant to pass. Caught by building one.
          release_apk="$(ls app/build/outputs/apk/release/podsilo-*.apk 2>/dev/null | head -1)"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          if [ -n "$release_apk" ] && "$apksigner" verify "$release_apk" >/dev/null 2>&1; then
              gh release upload "$TAG" "$release_apk" --clobber
              # Gzipped: it is ~50 MB of text, and it has to outlive the 7-day
              # artifact window to be any use when a crash report turns up later.
              gzip -kf app/build/outputs/mapping/release/mapping.txt
              mv app/build/outputs/mapping/release/mapping.txt.gz "mapping-$TAG.txt.gz"
              gh release upload "$TAG" "mapping-$TAG.txt.gz" --clobber
          else
              echo "::warning::Release APK is missing or unsigned — not attached. See dev-environment.adoc §10."
          fi
